name: Add ABSON feedback section

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/feedback-install.yml'

permissions:
  contents: write

jobs:
  install-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install feedback loader
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          tag = '<script src="feedback.js?v=1"></script>'
          marker = '<script src="script.js"></script>'

          if tag not in html:
              if marker not in html:
                  raise SystemExit('Could not find script.js marker in index.html')
              html = html.replace(marker, tag + '\n' + marker, 1)
              index.write_text(html, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add live Google Sheets feedback wall"
          git push
