name: Add ABSON feedback section

on:
  push:
    paths:
      - '.github/workflows/feedback-install.yml'

permissions:
  contents: write

jobs:
  install-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add feedback section and live loader
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          script = Path('script.js')
          html = index.read_text(encoding='utf-8')
          js = script.read_text(encoding='utf-8')

          css_marker = '/* ABSON PEOPLE WALL — LIVE FEEDBACK */'
          css = '''
<style>
/* ABSON PEOPLE WALL — LIVE FEEDBACK */
#abson-feedback{position:relative;overflow:hidden;background:#f8f4ec;padding:clamp(70px,9vw,120px) 0 80px}
#abson-feedback .abson-feedback-inner{width:min(1180px,90vw);margin:0 auto}
#abson-feedback .abson-feedback-heading{text-align:center;max-width:820px;margin:0 auto 42px}
#abson-feedback .abson-feedback-kicker{font:700 11px/1.2 'DM Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;margin:0 0 12px;color:#171717}
#abson-feedback .abson-feedback-heading h2{font:400 clamp(58px,8vw,112px)/.86 'Bebas Neue',sans-serif;letter-spacing:.01em;margin:0;color:#171717}
#abson-feedback .abson-feedback-heading h2 em{font-family:'Playfair Display',serif;font-size:.48em;font-weight:600;letter-spacing:0;vertical-align:middle}
#abson-feedback .abson-feedback-heading p{margin:18px auto 0;max-width:650px;font:400 16px/1.6 'DM Sans',sans-serif;color:#5b5b5b}
#abson-feedback .abson-feedback-toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
#abson-feedback .abson-feedback-live{font:900 11px/1.2 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#171717}
#abson-feedback .abson-feedback-live:before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:#d71920;margin-right:9px}
#abson-feedback .abson-feedback-count{font:700 11px/1.2 'DM Sans',sans-serif;letter-spacing:.14em;color:#666;text-transform:uppercase}
#absonFeedbackViewport{overflow:hidden;width:100%}
#absonFeedbackTrack{display:flex;width:100%;transition:transform .38s cubic-bezier(.2,.8,.2,1);will-change:transform}
.abson-feedback-card{flex:0 0 100%;width:100%;box-sizing:border-box;background:#fff;border:2px solid #171717;box-shadow:8px 8px 0 #171717;padding:clamp(28px,4vw,52px);min-height:330px;display:flex;flex-direction:column;justify-content:space-between}
.abson-feedback-quote{font:italic clamp(27px,4vw,48px)/1.18 'Playfair Display',serif;color:#171717;max-width:930px;margin:0}
.abson-feedback-quote:before{content:'“';display:block;font:900 52px/0.6 Georgia,serif;margin-bottom:16px;color:#d6aa35}
.abson-feedback-divider{height:1px;background:#ddd;margin:30px 0 18px}
.abson-feedback-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
.abson-feedback-name{font:900 13px/1.2 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#171717}
.abson-feedback-tag{font:600 10px/1.2 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#777;text-align:right}
#absonFeedbackControls{display:grid;grid-template-columns:52px 1fr 52px;gap:12px;align-items:center;margin-top:22px}
#absonFeedbackControls button{width:52px;height:52px;border:2px solid #171717;background:#ffd447;color:#171717;box-shadow:4px 4px 0 #171717;font:700 27px/1 Arial,sans-serif;cursor:pointer}
#absonFeedbackCounter{text-align:center;font:700 11px/1.2 'DM Sans',sans-serif;letter-spacing:.2em;color:#171717}
#absonFeedbackDots{display:flex;justify-content:center;gap:7px;margin-top:12px}
#absonFeedbackDots button{width:7px;height:7px;min-width:7px;padding:0;border:0;border-radius:50%;background:#c8c8c8;cursor:pointer}
#absonFeedbackDots button.active{background:#171717;transform:scale(1.35)}
#abson-feedback .abson-feedback-updated{text-align:center;margin:14px 0 0;font:400 11px/1.4 'DM Sans',sans-serif;color:#777}
#abson-feedback .abson-feedback-empty{background:#ffd447;border:2px dashed #171717;padding:42px;text-align:center;font:400 18px/1.5 'DM Sans',sans-serif}
#abson-feedback .abson-feedback-empty strong{display:block;font:400 46px/.95 'Bebas Neue',sans-serif;margin-bottom:12px}
@media(max-width:700px){#abson-feedback{padding:62px 0 70px}#abson-feedback .abson-feedback-inner{width:90vw}#abson-feedback .abson-feedback-heading{margin-bottom:30px}#abson-feedback .abson-feedback-heading h2{font-size:68px}#abson-feedback .abson-feedback-heading p{font-size:14px}#abson-feedback .abson-feedback-toolbar{margin-bottom:14px}#abson-feedback .abson-feedback-live{font-size:9px}#abson-feedback .abson-feedback-count{font-size:9px}.abson-feedback-card{min-height:330px;padding:24px 20px;box-shadow:5px 5px 0 #171717}.abson-feedback-quote{font-size:27px}.abson-feedback-quote:before{font-size:45px;margin-bottom:13px}.abson-feedback-divider{margin:24px 0 15px}.abson-feedback-meta{display:block}.abson-feedback-tag{text-align:left;margin-top:7px}#absonFeedbackControls{grid-template-columns:44px 1fr 44px;gap:8px;margin-top:17px}#absonFeedbackControls button{width:44px;height:46px;font-size:24px}}
</style>
'''
          if css_marker not in html:
              html = html.replace('</head>', css + '\n</head>', 1)

          section_marker = '<section id="abson-feedback"'
          section = '''
<section id="abson-feedback" class="section">
  <div class="abson-watermark" aria-hidden="true">#ABSON</div>
  <div class="abson-feedback-inner">
    <div class="abson-feedback-heading">
      <p class="abson-feedback-kicker">THE PEOPLE’S WALL</p>
      <h2>YOU SAID IT. <em>WE KEPT IT.</em></h2>
      <p>The messages, wishes and questionable wisdom already sent in by the people joining the chaos.</p>
    </div>
    <div class="abson-feedback-toolbar">
      <div class="abson-feedback-live">LIVE FEEDBACK</div>
      <div id="absonFeedbackCount" class="abson-feedback-count">0 MESSAGES</div>
    </div>
    <div id="absonFeedbackViewport">
      <div id="absonFeedbackTrack"></div>
    </div>
    <div id="absonFeedbackControls">
      <button id="absonFeedbackPrev" type="button" aria-label="Previous feedback">‹</button>
      <div>
        <div id="absonFeedbackCounter">00 / 00</div>
        <div id="absonFeedbackDots"></div>
      </div>
      <button id="absonFeedbackNext" type="button" aria-label="Next feedback">›</button>
    </div>
    <p id="absonFeedbackUpdated" class="abson-feedback-updated">Updated just now · new messages appear automatically.</p>
  </div>
</section>
'''
          if section_marker not in html:
              anchor = '<section class="guest-upload section" id="guest-photos">'
              if anchor not in html:
                  anchor = '<section class="rsvp section" id="rsvp">'
              html = html.replace(anchor, section + '\n' + anchor, 1)

          nav_link = '<a href="#abson-feedback">THE PEOPLE’S WALL</a>'
          if nav_link not in html:
              upload_link = '<a href="#guest-photos">Upload Photos</a>'
              if upload_link in html:
                  html = html.replace(upload_link, nav_link + '\n    ' + upload_link, 1)

          js_marker = '/* ABSON LIVE FEEDBACK LOADER */'
          feedback_js = '''
/* ABSON LIVE FEEDBACK LOADER */
let absonFeedbackItems=[],absonFeedbackIndex=0;
function ensureAbsonFeedback(){return document.getElementById('abson-feedback')}
function escapeFeedbackText(v){return String(v==null?'':v).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function renderAbsonFeedback(items){const track=document.getElementById('absonFeedbackTrack'),counter=document.getElementById('absonFeedbackCounter'),dots=document.getElementById('absonFeedbackDots'),count=document.getElementById('absonFeedbackCount'),controls=document.getElementById('absonFeedbackControls');if(!track)return;absonFeedbackItems=(Array.isArray(items)?items:[]).filter(x=>x&&String(x.message||'').trim());if(count)count.textContent=absonFeedbackItems.length+' MESSAGE'+(absonFeedbackItems.length===1?'':'S');if(!absonFeedbackItems.length){track.innerHTML='<div class="abson-feedback-empty"><strong>NO MESSAGES YET.</strong>Be the first to leave your #ABSON feedback.</div>';if(controls)controls.style.display='none';return}if(controls)controls.style.display='grid';track.innerHTML=absonFeedbackItems.map(x=>{const name=escapeFeedbackText(x.name||'Anonymous #ABSON'),msg=escapeFeedbackText(x.message||'').replace(/\n/g,'<br>'),tag=escapeFeedbackText(x.event||x.attendance||'#ABSON');return '<article class="abson-feedback-card"><div><p class="abson-feedback-quote">'+msg+'</p></div><div><div class="abson-feedback-divider"></div><div class="abson-feedback-meta"><div class="abson-feedback-name">— '+name+'</div><div class="abson-feedback-tag">'+tag+'</div></div></div></article>'}).join('');dots.innerHTML='';absonFeedbackItems.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Go to feedback '+(i+1));b.addEventListener('click',()=>showAbsonFeedback(i));dots.appendChild(b)});showAbsonFeedback(0)}
function showAbsonFeedback(index){if(!absonFeedbackItems.length)return;absonFeedbackIndex=(index+absonFeedbackItems.length)%absonFeedbackItems.length;const track=document.getElementById('absonFeedbackTrack'),counter=document.getElementById('absonFeedbackCounter'),dots=document.getElementById('absonFeedbackDots');if(track)track.style.transform='translateX(-'+(absonFeedbackIndex*100)+'%)';if(counter)counter.textContent=String(absonFeedbackIndex+1).padStart(2,'0')+' / '+String(absonFeedbackItems.length).padStart(2,'0');if(dots)Array.from(dots.children).forEach((d,i)=>d.classList.toggle('active',i===absonFeedbackIndex))}
async function loadAbsonFeedback(){if(!ensureAbsonFeedback())return;try{const r=await fetch(API_URL+'?action=feedback&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('request failed');const data=await r.json();if(!data.ok)throw new Error(data.error||'feedback unavailable');renderAbsonFeedback(data.feedback||[]);const updated=document.getElementById('absonFeedbackUpdated');if(updated)updated.textContent='Updated just now · new messages appear automatically.'}catch(err){console.warn('#ABSON feedback:',err);renderAbsonFeedback([])}}
(function(){const prev=document.getElementById('absonFeedbackPrev'),next=document.getElementById('absonFeedbackNext');if(prev)prev.addEventListener('click',()=>showAbsonFeedback(absonFeedbackIndex-1));if(next)next.addEventListener('click',()=>showAbsonFeedback(absonFeedbackIndex+1));const section=ensureAbsonFeedback();if(section){let sx=0;section.addEventListener('touchstart',e=>{if(e.touches.length)sx=e.touches[0].clientX},{passive:true});section.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>55)showAbsonFeedback(absonFeedbackIndex+(dx<0?1:-1))},{passive:true});loadAbsonFeedback();setInterval(loadAbsonFeedback,30000)}})();
'''
          if js_marker not in js:
              pos = js.rfind('\n});')
              if pos == -1:
                  raise SystemExit('Could not find script.js closing marker')
              js = js[:pos] + feedback_js + js[pos:]

          index.write_text(html, encoding='utf-8')
          script.write_text(js, encoding='utf-8')

      - name: Commit changes and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git rm .github/workflows/feedback-install.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add live Google Sheets feedback carousel"
          git push
