name: Final camera roll mobile fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-camera-roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply mobile one-card carousel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          marker='/* #ABSON MOBILE CAMERA ROLL CAROUSEL PATCH */'
          if marker in s:
              s=s.split(marker,1)[0].rstrip()+'\n'
          patch=r'''/* #ABSON MOBILE CAMERA ROLL CAROUSEL PATCH */
          (function(){
            function init(){
              const wall=document.getElementById('guest-wall'),grid=document.getElementById('guestWallGrid');
              if(!wall||!grid)return false;
              const toolbar=wall.querySelector('.guest-wall-toolbar');
              if(!toolbar)return false;
              let nav=wall.querySelector('.camera-mobile-nav');
              if(!nav){
                nav=document.createElement('div');nav.className='camera-mobile-nav';
                nav.innerHTML='<button type="button" class="camera-mobile-arrow" data-dir="-1" aria-label="Previous photo">←</button><span class="camera-mobile-count">01 / 01</span><button type="button" class="camera-mobile-arrow" data-dir="1" aria-label="Next photo">→</button>';
                toolbar.appendChild(nav);
              }
              let index=0,startX=0,startY=0;
              const cards=()=>Array.from(grid.querySelectorAll('.guest-wall-card'));
              function update(){
                const list=cards();if(!list.length)return;
                if(index<0)index=list.length-1;if(index>=list.length)index=0;
                if(window.matchMedia('(max-width:700px)').matches){
                  grid.style.setProperty('display','block','important');
                  grid.style.setProperty('transform','none','important');
                  grid.style.setProperty('overflow','hidden','important');
                  list.forEach((card,i)=>{card.classList.toggle('camera-mobile-active',i===index);card.style.setProperty('display',i===index?'block':'none','important');});
                  const img=list[index].querySelector('img');if(img)img.loading='eager';
                }
                const count=wall.querySelector('.camera-mobile-count');if(count)count.textContent=String(index+1).padStart(2,'0')+' / '+String(list.length).padStart(2,'0');
              }
              if(!nav.dataset.bound){
                nav.dataset.bound='1';
                nav.querySelector('[data-dir="-1"]').addEventListener('click',()=>{index--;update()});
                nav.querySelector('[data-dir="1"]').addEventListener('click',()=>{index++;update()});
                grid.addEventListener('touchstart',e=>{if(e.touches.length){startX=e.touches[0].clientX;startY=e.touches[0].clientY}},{passive:true});
                grid.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.15){index+=dx<0?1:-1;update()}},{passive:true});
              }
              if(!grid.dataset.cameraObserver){grid.dataset.cameraObserver='1';new MutationObserver(()=>{index=0;update()}).observe(grid,{childList:true})}
              update();return true;
            }
            if(!init()){const obs=new MutationObserver(()=>{if(init())obs.disconnect()});obs.observe(document.body,{childList:true,subtree:true})}
          })();
          '''
          p.write_text(s+'\n'+patch.strip()+'\n',encoding='utf-8')

          css=Path('guest-wall.css')
          c=css.read_text(encoding='utf-8')
          marker2='CAMERA MOBILE CAROUSEL DISPLAY FIX'
          if marker2 not in c:
              c+=r'''

/* CAMERA MOBILE CAROUSEL DISPLAY FIX */
@media(max-width:700px){
  .guest-wall-grid{display:block!important;overflow:hidden!important;overflow-x:hidden!important;transform:none!important;transition:none!important;touch-action:pan-y!important;padding:4px 4px 12px!important;width:100%!important}
  .guest-wall-card{display:none!important;flex:none!important;width:100%!important;min-width:100%!important;max-width:100%!important;margin:0!important;box-sizing:border-box!important}
  .guest-wall-card.camera-mobile-active{display:block!important}
  .guest-wall-card .guest-wall-media{display:block!important;width:100%!important;height:auto!important}
  .guest-wall-card .guest-wall-media img,.guest-wall-card .guest-wall-media>img{display:block!important;width:100%!important;height:auto!important;max-width:100%!important;object-fit:contain!important}
  .camera-mobile-nav{display:flex!important;align-items:center;gap:10px;order:2}
}
'''
              css.write_text(c,encoding='utf-8')
          PY

      - name: Commit final fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js guest-wall.css
          git commit -m 'Fix mobile camera roll carousel rendering'
          git push
